<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aya — Komara Agency</title>
  <meta name="description" content="Aya, l'assistante de Komara Agency : services, tarifs, devis et accompagnement digital." />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Aya" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
  <link rel="icon" href="/static/icons/icon-192.png" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <img src="/static/icons/avatar.png" alt="" class="brand-logo" />
        <div class="brand-text">
          <strong>Aya</strong>
          <span>Komara Agency</span>
        </div>
      </div>
      <div class="topbar-actions">
        <select id="lang" aria-label="Langue">
          <option value="fr">FR</option>
          <option value="en">EN</option>
          <option value="ar">AR</option>
        </select>
        <button id="install" class="ghost" hidden>Installer</button>
        <button id="reset" class="ghost" title="Nouvelle conversation">Nouveau</button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite">
      <section class="welcome" id="welcome">
        <img src="/static/icons/avatar.png" alt="" class="welcome-logo" />
        <h1>Bonjour, je suis Aya</h1>
        <p>Assistante de Komara Agency. Bots WhatsApp, Telegram et TikTok, design graphique, accompagnement digital.</p>
        <div class="suggestions">
          <button class="chip" data-prompt="Quels sont vos tarifs ?">Vos tarifs</button>
          <button class="chip" data-prompt="Je veux un bot WhatsApp pour mon business">Un bot WhatsApp</button>
          <button class="chip" data-prompt="Je veux un devis">Demander un devis</button>
          <button class="chip" data-prompt="Montre-moi vos réalisations">Vos réalisations</button>
        </div>
      </section>
    </main>

    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="Écrivez votre message…" autocomplete="off"></textarea>
      <button id="send" type="submit" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/></svg>
      </button>
    </form>
    <p class="hint">Aya est une IA supervisée par l'équipe Komara Agency.</p>
  </div>

  <div class="modal" id="login" hidden>
    <form class="modal-card" id="login-form">
      <h2>Accès protégé</h2>
      <p>Entrez le mot de passe fourni par Komara Agency.</p>
      <input id="login-token" type="password" placeholder="Mot de passe" autocomplete="current-password" />
      <button type="submit">Entrer</button>
      <p class="error" id="login-error" hidden></p>
    </form>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
